[project]
name = "tpch-lakehouse-regional"
version = "0.1.0"
description = "TPC-H medallion lakehouse (bronze / silver / gold) for the Regional Manager profile"
readme = "README.md"
requires-python = ">=3.10,<3.13"
# Runtime dependencies are provided by the Databricks runtime (pyspark, delta).
dependencies = []

[dependency-groups]
dev = [
    "pyspark==3.5.3",   # local test engine (Databricks provides Spark in the workspace)
    "duckdb==1.1.3",    # only used to generate TPC-H test data locally (dbgen)
    "pytest>=8",
    "matplotlib>=3.8",
    "pandas>=2",
    "pyarrow>=15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tpch_lakehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
