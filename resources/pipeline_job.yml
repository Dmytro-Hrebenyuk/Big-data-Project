resources:
  jobs:
    tpch_regional_pipeline:
      name: tpch-regional-lakehouse-${var.env}
      # No cluster block: tasks run on serverless compute.
      parameters:
        - {name: catalog, default: "${var.catalog}"}
        - {name: env, default: "${var.env}"}
        - {name: source_catalog, default: "${var.source_catalog}"}
        - {name: source_schema, default: "${var.source_schema}"}
      tasks:
        - task_key: bronze
          notebook_task: {notebook_path: ../notebooks/01_bronze.py}
        - task_key: silver
          depends_on: [{task_key: bronze}]
          notebook_task: {notebook_path: ../notebooks/02_silver.py}
        - task_key: gold
          depends_on: [{task_key: silver}]
          notebook_task: {notebook_path: ../notebooks/03_gold.py}
        - task_key: validation            # fails the run if any data quality check fails
          depends_on: [{task_key: gold}]
          notebook_task: {notebook_path: ../notebooks/04_validation.py}
        - task_key: monitoring
          depends_on: [{task_key: validation}]
          notebook_task: {notebook_path: ../notebooks/06_monitoring_alerts.py}
